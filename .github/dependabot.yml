# O Dependabot abre PRs sozinho quando uma dependência tem versão nova ou falha de segurança.
# Agrupa as atualizações pequenas (minor/patch) em um PR só por semana, para não encher a caixa de entrada.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # os tipos do Node precisam acompanhar a versão do Node que o projeto usa (22), não a mais nova.
    # Ao subir o Node (engines em package.json e node-version em ci.yml), mude também esta linha.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # as ações do próprio CI também são dependências (e já foram alvo de ataques de cadeia de suprimentos)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
